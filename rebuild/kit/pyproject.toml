[project]
name = "audiosearch"
version = "0.1.0"
description = "Hybrid (keyword + semantic + sounds-like) search over two-speaker audio, down to the moment"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pyyaml>=6",
  "typer>=0.12",
  "sentence-transformers>=3",
]

[project.optional-dependencies]
pipeline = ["faster-whisper>=1.1", "speechbrain>=1.0", "scikit-learn>=1.5", "torchaudio"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
audiosearch = "audiosearch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiosearch"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]  # typer.Option defaults; typographic quotes

[tool.pytest.ini_options]
testpaths = ["tests"]
