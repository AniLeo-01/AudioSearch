services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: audiosearch
      POSTGRES_PASSWORD: audiosearch
      POSTGRES_DB: audiosearch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiosearch -d audiosearch"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      AUDIOSEARCH_DATABASE_URL: postgresql://audiosearch:audiosearch@db:5432/audiosearch
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
